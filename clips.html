<!DOCTYPE html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>焊接教學短片</title>
<style>:root{--bg:#ecebe4;--ink:#1a1a18;--mute:#6a665c;--line:#cfcabd;--card:#fbfaf6;--cyan:#0a7f8c}*{box-sizing:border-box}
body{font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0 auto;padding:16px;max-width:1000px;line-height:1.7}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--ink);padding-bottom:6px;margin-bottom:12px}h1{font-size:1.3rem;margin:0}header a{color:var(--cyan)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);padding:10px}
video{width:100%;aspect-ratio:16/9;background:#000;display:block}h2{font-size:1rem;margin:8px 0 4px}.note{color:var(--mute);font-size:.85rem}</style></head><body>
<header><h1>焊接教學短片</h1><a href="index.html">← 回模擬器</a></header>
<p class="note">七段短片依講義 2.6 的順序：剝線 → 沾錫 → 焊蜂鳴器 → 焊 ADXL345 → 焊主板 → 蜂鳴器線到主板 → 通電測試。每段 25 秒內，無旁白，字幕說明步驟。</p>
<div class="grid" id="g"><p class="note">短片整理中…</p></div>
<script>fetch('clips/index.json').then(r=>r.json()).then(list=>{const g=document.getElementById('g');if(!list.length){g.innerHTML='<p class="note">短片尚未上傳（剪輯在 Mac Studio 進行中）。</p>';return}
g.innerHTML=list.map(c=>`<div class="card"><video controls preload="metadata" poster="clips/${c.poster||''}" src="clips/${c.file}"></video><h2>${c.title}</h2><p class="note">${c.duration?Math.round(c.duration)+' 秒':''}</p></div>`).join('')}).catch(()=>{})</script>
</body></html>
