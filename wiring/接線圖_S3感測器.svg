ke-width="5" stroke-linejoin="round" /><circle cx="392" cy="468" r="6" fill="#f9a825"/><circle cx="740" cy="468" r="5" fill="#f9a825"/><polyline points="740,262 1090,262" fill="none" stroke="#f9a825" stroke-width="4" stroke-linejoin="round" /><circle cx="740" cy="262" r="5" fill="#f9a825"/><polyline points="740,612 1090,612" fill="none" stroke="#f9a825" stroke-width="4" stroke-linejoin="round" /><circle cx="740" cy="612" r="5" fill="#f9a825"/><polyline points="740,902 1090,902" fill="none" stroke="#f9a825" stroke-width="4" stroke-linejoin="round" /><circle cx="740" cy="902" r="5" fill="#f9a825"/><text x="740" y="250" font-size="15" fill="#f9a825" text-anchor="middle" font-weight="bold">SCL(17)</text><rect x="1100" y="170" width="300" height="280" rx="10" fill="#f4f6fa" stroke="#90a4ae" stroke-width="2"/><text x="1416" y="198" font-size="22" fill="#222" text-anchor="start" font-weight="bold">MPU6050（GY-521）</text><text x="1416" y="226" font-size="16" fill="#555" text-anchor="start" font-weight="normal">加速度＋陀螺儀　位址 0x68</text><rect x="1090" y="193" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="208" font-size="17" fill="#222" text-anchor="start" font-weight="normal">VCC</text><rect x="1090" y="223" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="238" font-size="17" fill="#222" text-anchor="start" font-weight="normal">GND</text><rect x="1090" y="253" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="268" font-size="17" fill="#222" text-anchor="start" font-weight="normal">SCL</text><rect x="1090" y="283" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="298" font-size="17" fill="#222" text-anchor="start" font-weight="normal">SDA</text><rect x="1090" y="313" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="328" font-size="17" fill="#222" text-anchor="start" font-weight="normal">XDA</text><text x="1250" y="328" font-size="15" fill="#999" text-anchor="start" font-weight="normal">不接</text><rect x="1090" y="343" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="358" font-size="17" fill="#222" text-anchor="start" font-weight="normal">XCL</text><text x="1250" y="358" font-size="15" fill="#999" text-anchor="start" font-weight="normal">不接</text><rect x="1090" y="373" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="388" font-size="17" fill="#222" text-anchor="start" font-weight="normal">AD0</text><text x="1250" y="388" font-size="15" fill="#999" text-anchor="start" font-weight="normal">不接</text><rect x="1090" y="403" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="418" font-size="17" fill="#222" text-anchor="start" font-weight="normal">INT</text><rect x="1100" y="520" width="300" height="220" rx="10" fill="#f4f6fa" stroke="#90a4ae" stroke-width="2"/><text x="1416" y="548" font-size="22" fill="#222" text-anchor="start" font-weight="bold">VL53L0X（GY-530）</text><text x="1416" y="576" font-size="16" fill="#555" text-anchor="start" font-weight="normal">雷射測距　位址 0x29</text><rect x="1090" y="543" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="558" font-size="17" fill="#222" text-anchor="start" font-weight="normal">VIN</text><rect x="1090" y="573" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="588" font-size="17" fill="#222" text-anchor="start" font-weight="normal">GND</text><rect x="1090" y="603" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="618" font-size="17" fill="#222" text-anchor="start" font-weight="normal">SCL</text><rect x="1090" y="633" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="648" font-size="17" fill="#222" text-anchor="start" font-weight="normal">SDA</text><rect x="1090" y="663" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="678" font-size="17" fill="#222" text-anchor="start" font-weight="normal">GPIO1</text><text x="1250" y="678" font-size="15" fill="#999" text-anchor="start" font-weight="normal">不接</text><rect x="1090" y="693" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="708" font-size="17" fill="#222" text-anchor="start" font-weight="normal">XSHUT</text><rect x="1100" y="810" width="300" height="250" rx="10" fill="#f4f6fa" stroke="#90a4ae" stroke-width="2"/><text x="1416" y="838" font-size="22" fill="#222" text-anchor="start" font-weight="bold">MAX30102</text><text x="1416" y="866" font-size="16" fill="#555" text-anchor="start" font-weight="normal">心率／血氧　位址 0x57</text><rect x="1090" y="833" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="848" font-size="17" fill="#222" text-anchor="start" font-weight="normal">VIN</text><rect x="1090" y="863" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="878" font-size="17" fill="#222" text-anchor="start" font-weight="normal">SDA</text><rect x="1090" y="893" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="908" font-size="17" fill="#222" text-anchor="start" font-weight="normal">SCL</text><rect x="1090" y="923" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="938" font-size="17" fill="#222" text-anchor="start" font-weight="normal">INT</text><rect x="1090" y="953" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="968" font-size="17" fill="#222" text-anchor="start" font-weight="normal">IRD</text><text x="1250" y="968" font-size="15" fill="#999" text-anchor="start" font-weight="normal">不接</text><rect x="1090" y="983" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="998" font-size="17" fill="#222" text-anchor="start" font-weight="normal">RD</text><text x="1250" y="998" font-size="15" fill="#999" text-anchor="start" font-weight="normal">不接</text><rect x="1090" y="1013" width="20" height="18" rx="3" fill="#d4af37"/><text x="1120" y="1028" font-size="17" fill="#222" text-anchor="start" font-weight="normal">GND</text><polyline points="198,420 118,420 118,1110 1030,1110 1030,932 1090,932" fill="none" stroke="#8e24aa" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7"/><circle cx="198" cy="420" r="5" fill="#8e24aa"/><text x="1240" y="938" font-size="15" fill="#8e24aa" text-anchor="start" font-weight="normal">→ GPIO10（選配）</text><polyline points="198,468 96,468 96,1134 1050,1134 1050,702 1090,702" fill="none" stroke="#00897b" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7"/><circle cx="198" cy="468" r="5" fill="#00897b"/><text x="1240" y="708" font-size="15" fill="#00897b" text-anchor="start" font-weight="normal">→ GPIO11（選配）</text><polyline points="198,324 74,324 74,1158 1070,1158 1070,412 1090,412" fill="none" stroke="#8e24aa" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7"/><circle cx="198" cy="324" r="5" fill="#8e24aa"/><text x="1240" y="418" font-size="15" fill="#8e24aa" text-anchor="start" font-weight="normal">→ GPIO2（選配）</text><polyline points="198,276 40,276 40,1200" fill="none" stroke="#6d4c41" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 7"/><circle cx="198" cy="276" r="5" fill="#6d4c41"/><text x="50" y="1222" font-size="15" fill="#6d4c41" text-anchor="start" font-weight="normal">GPIO1 → 蜂鳴器（選配，韌體已設定）</text><text x="60" y="56" font-size="30" fill="#111" text-anchor="start" font-weight="bold">T-Display S3 感測器接線圖：三顆都接同一組 I2C（SDA 18、SCL 17）</text><text x="60" y="92" font-size="17" fill="#444" text-anchor="start" font-weight="normal">實線＝一定要接；虛線＝選配（中斷喚醒、重設用，先不接也能動）。模組腳位順序以手上模組的絲印為準，照「腳名」接，不要照位置。</text><text x="330" y="1262" font-size="17" fill="#333" text-anchor="start" font-weight="normal">① 電源一律接 3V，不要接 5V；3V 腳總負載不超過 100 mA（三顆合計約 30～60 mA）。</text><text x="330" y="1290" font-size="17" fill="#333" text-anchor="start" font-weight="normal">② 三顆位址不同（0x68、0x29、0x57），並聯在同一組 SDA／SCL 上即可。</text><text x="330" y="1318" font-size="17" fill="#333" text-anchor="start" font-weight="normal">③ MAX30102 紫色小板：背面有上拉電壓跳線，要選 3.3V；接好後量 SDA 對 GND 應約 3.3 V，只有 1.8～2.5 V 就是跳線沒改。</text><text x="330" y="1346" font-size="17" fill="#333" text-anchor="start" font-weight="normal">④ MPU6050 的 AD0、XDA、XCL 不接（AD0 不接＝位址 0x68）。</text><text x="330" y="1374" font-size="17" fill="#333" text-anchor="start" font-weight="normal">⑤ 線越短越好（20 cm 內）；焊完先用萬用表確認 3V 與 GND 沒有短路再插 USB。</text></svg>