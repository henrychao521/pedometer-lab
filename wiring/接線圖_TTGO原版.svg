82" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="748" y="389" font-size="18" fill="#fff" text-anchor="start" font-weight="normal">22</text><circle cx="922" cy="382" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="902" y="389" font-size="18" fill="#fff" text-anchor="end" font-weight="normal">38</text><circle cx="728" cy="430" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="748" y="437" font-size="18" fill="#fff" text-anchor="start" font-weight="normal">17</text><circle cx="922" cy="430" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="902" y="437" font-size="18" fill="#fff" text-anchor="end" font-weight="normal">39</text><circle cx="728" cy="478" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="748" y="485" font-size="18" fill="#fff" text-anchor="start" font-weight="normal">2</text><circle cx="922" cy="478" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="902" y="485" font-size="18" fill="#fff" text-anchor="end" font-weight="normal">32</text><circle cx="728" cy="526" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="748" y="533" font-size="18" fill="#fff" text-anchor="start" font-weight="normal">15</text><circle cx="922" cy="526" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="902" y="533" font-size="18" fill="#fff" text-anchor="end" font-weight="normal">33</text><circle cx="728" cy="574" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="748" y="581" font-size="18" fill="#fff" text-anchor="start" font-weight="normal">13</text><circle cx="922" cy="574" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="902" y="581" font-size="18" fill="#fff" text-anchor="end" font-weight="normal">25</text><circle cx="728" cy="622" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="748" y="629" font-size="18" fill="#fff" text-anchor="start" font-weight="normal">12</text><circle cx="922" cy="622" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="902" y="629" font-size="18" fill="#fff" text-anchor="end" font-weight="normal">26</text><circle cx="728" cy="670" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="748" y="677" font-size="18" fill="#fff" text-anchor="start" font-weight="normal">GND</text><circle cx="922" cy="670" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="902" y="677" font-size="18" fill="#fff" text-anchor="end" font-weight="normal">27</text><circle cx="728" cy="718" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="748" y="725" font-size="18" fill="#fff" text-anchor="start" font-weight="normal">GND</text><circle cx="922" cy="718" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="902" y="725" font-size="18" fill="#fff" text-anchor="end" font-weight="normal">GND</text><circle cx="728" cy="766" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="748" y="773" font-size="18" fill="#fff" text-anchor="start" font-weight="normal">3V</text><circle cx="922" cy="766" r="11" fill="#d4af37" stroke="#fff" stroke-width="2"/><text x="902" y="773" font-size="18" fill="#fff" text-anchor="end" font-weight="normal">5V</text><text x="728" y="184" font-size="17" fill="#444" text-anchor="middle" font-weight="normal">左排 P5</text><text x="922" y="184" font-size="17" fill="#444" text-anchor="middle" font-weight="normal">右排 P4</text><rect x="120" y="250" width="250" height="280" rx="10" fill="#f4f6fa" stroke="#90a4ae" stroke-width="2"/><text x="120" y="206" font-size="22" fill="#222" text-anchor="start" font-weight="bold">ADXL345（GY-291）</text><text x="120" y="234" font-size="16" fill="#555" text-anchor="start" font-weight="normal">三軸加速度計　I2C 位址 0x53</text><rect x="360" y="273" width="20" height="18" rx="3" fill="#d4af37"/><text x="350" y="288" font-size="17" fill="#222" text-anchor="end" font-weight="normal">GND</text><polyline points="380,282 470,282 470,238 728,238" fill="none" stroke="#222" stroke-width="5" stroke-linejoin="round" /><circle cx="380" cy="282" r="5" fill="#222"/><circle cx="728" cy="238" r="6" fill="#222"/><text x="470" y="228" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">GND</text><rect x="360" y="303" width="20" height="18" rx="3" fill="#d4af37"/><text x="350" y="318" font-size="17" fill="#222" text-anchor="end" font-weight="normal">VCC</text><polyline points="380,312 510,312 510,766 728,766" fill="none" stroke="#e53935" stroke-width="5" stroke-linejoin="round" /><circle cx="380" cy="312" r="5" fill="#e53935"/><circle cx="728" cy="766" r="6" fill="#e53935"/><text x="510" y="790" font-size="15" fill="#e53935" text-anchor="middle" font-weight="bold">3V</text><rect x="360" y="333" width="20" height="18" rx="3" fill="#d4af37"/><text x="350" y="348" font-size="17" fill="#222" text-anchor="end" font-weight="normal">CS</text><text x="140" y="348" font-size="15" fill="#999" text-anchor="start" font-weight="normal">不接</text><rect x="360" y="363" width="20" height="18" rx="3" fill="#d4af37"/><text x="350" y="378" font-size="17" fill="#222" text-anchor="end" font-weight="normal">INT1</text><text x="140" y="378" font-size="15" fill="#999" text-anchor="start" font-weight="normal">不接</text><rect x="360" y="393" width="20" height="18" rx="3" fill="#d4af37"/><text x="350" y="408" font-size="17" fill="#222" text-anchor="end" font-weight="normal">INT2</text><text x="140" y="408" font-size="15" fill="#999" text-anchor="start" font-weight="normal">不接</text><rect x="360" y="423" width="20" height="18" rx="3" fill="#d4af37"/><text x="350" y="438" font-size="17" fill="#222" text-anchor="end" font-weight="normal">SDO</text><text x="140" y="438" font-size="15" fill="#999" text-anchor="start" font-weight="normal">不接</text><rect x="360" y="453" width="20" height="18" rx="3" fill="#d4af37"/><text x="350" y="468" font-size="17" fill="#222" text-anchor="end" font-weight="normal">SDA</text><polyline points="380,462 560,462 560,334 728,334" fill="none" stroke="#1e88e5" stroke-width="4" stroke-linejoin="round" /><circle cx="380" cy="462" r="5" fill="#1e88e5"/><circle cx="728" cy="334" r="6" fill="#1e88e5"/><text x="560" y="324" font-size="15" fill="#1e88e5" text-anchor="middle" font-weight="bold">SDA(21)</text><rect x="360" y="483" width="20" height="18" rx="3" fill="#d4af37"/><text x="350" y="498" font-size="17" fill="#222" text-anchor="end" font-weight="normal">SCL</text><polyline points="380,492 610,492 610,382 728,382" fill="none" stroke="#f9a825" stroke-width="4" stroke-linejoin="round" /><circle cx="380" cy="492" r="5" fill="#f9a825"/><circle cx="728" cy="382" r="6" fill="#f9a825"/><text x="610" y="372" font-size="15" fill="#f9a825" text-anchor="middle" font-weight="bold">SCL(22)</text><circle cx="1220" cy="540" r="62" fill="#263238"/><circle cx="1220" cy="540" r="12" fill="#111"/><text x="1310" y="516" font-size="22" fill="#222" text-anchor="start" font-weight="bold">無源蜂鳴器</text><text x="1310" y="544" font-size="16" fill="#555" text-anchor="start" font-weight="normal">GPIO25 發方波</text><rect x="1140" y="511" width="20" height="18" rx="3" fill="#d4af37"/><text x="1168" y="527" font-size="18" fill="#fff" text-anchor="start" font-weight="normal">＋</text><polyline points="922,574 1030,574 1030,520 1140,520" fill="none" stroke="#6d4c41" stroke-width="4" stroke-linejoin="round" /><circle cx="922" cy="574" r="6" fill="#6d4c41"/><circle cx="1140" cy="520" r="5" fill="#6d4c41"/><rect x="1140" y="561" width="20" height="18" rx="3" fill="#d4af37"/><text x="1168" y="577" font-size="18" fill="#fff" text-anchor="start" font-weight="normal">－</text><polyline points="922,718 1070,718 1070,570 1140,570" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" /><circle cx="922" cy="718" r="6" fill="#222"/><circle cx="1140" cy="570" r="5" fill="#222"/><text x="992" y="564" font-size="15" fill="#6d4c41" text-anchor="middle" font-weight="bold">GPIO25</text><rect x="120" y="960" width="1400" height="140" rx="12" fill="#fafafa" stroke="#cfd8dc" stroke-width="2"/><text x="140" y="992" font-size="18" fill="#222" text-anchor="start" font-weight="bold">板子背面：電池</text><rect x="200" y="1010" width="190" height="72" rx="10" fill="#cfd8dc" stroke="#607d8b" stroke-width="2"/><text x="295" y="1042" font-size="20" fill="#222" text-anchor="middle" font-weight="bold">1000mAh</text><text x="295" y="1068" font-size="15" fill="#333" text-anchor="middle" font-weight="normal">3.7V 鋰電池</text><rect x="560" y="1006" width="100" height="40" rx="6" fill="#fff" stroke="#e53935" stroke-width="3"/><text x="610" y="1033" font-size="17" fill="#e53935" text-anchor="middle" font-weight="bold">開關</text><rect x="840" y="1010" width="200" height="72" rx="8" fill="#1c1f26"/><text x="940" y="1040" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">JST 電池座</text><text x="940" y="1066" font-size="14" fill="#cfd8dc" text-anchor="middle" font-weight="normal">TTGO 背面</text><polyline points="390,1026 560,1026" fill="none" stroke="#e53935" stroke-width="5" stroke-linejoin="round" /><polyline points="660,1026 840,1026" fill="none" stroke="#e53935" stroke-width="5" stroke-linejoin="round" /><polyline points="390,1066 840,1066" fill="none" stroke="#222" stroke-width="5" stroke-linejoin="round" /><text x="475" y="1018" font-size="15" fill="#e53935" text-anchor="middle" font-weight="normal">紅線（＋）</text><text x="750" y="1018" font-size="15" fill="#e53935" text-anchor="middle" font-weight="normal">紅線（＋）</text><text x="615" y="1088" font-size="15" fill="#222" text-anchor="middle" font-weight="normal">黑線（－）不經過開關</text><text x="1080" y="1040" font-size="15" fill="#555" text-anchor="start" font-weight="normal">插頭紅黑方向要對上板子的 ＋／－，</text><text x="1080" y="1064" font-size="15" fill="#555" text-anchor="start" font-weight="normal">插反可能損壞板子。</text><text x="60" y="56" font-size="30" fill="#111" text-anchor="start" font-weight="bold">原版計步器接線圖：TTGO T-Display ＋ ADXL345 ＋ 蜂鳴器 ＋ 電池</text><text x="60" y="92" font-size="17" fill="#444" text-anchor="start" font-weight="normal">排針順序依 LilyGO 原廠電路圖（P4、P5）；動手前請再對一次板子背面的絲印。模組腳位順序以手上模組的絲印為準，照「腳名」接，不要照位置。</text><text x="120" y="1150" font-size="17" fill="#333" text-anchor="start" font-weight="normal">① ADXL345 只接 4 條：VCC→3V、GND→GND、SDA→21、SCL→22；CS、INT1、INT2、SDO 不接。</text><text x="120" y="1180" font-size="17" fill="#333" text-anchor="start" font-weight="normal">② 電源接 3V，不要接 5V。換成 MPU6050（GY-521）也照同樣 4 條接，程式開機會自動認。</text><text x="120" y="1210" font-size="17" fill="#333" text-anchor="start" font-weight="normal">③ 蜂鳴器用「無源」的（通電不會自己響）：＋ 接 GPIO25，－ 接右排下方的 GND。</text><text x="120" y="1240" font-size="17" fill="#333" text-anchor="start" font-weight="normal">④ 開關串在電池紅線上；電池插板子背面的 JST 電池座，注意紅黑方向。</text><text x="120" y="1270" font-size="17" fill="#333" text-anchor="start" font-weight="normal">⑤ 焊完先用萬用表確認 3V 與 GND 沒有短路，再插 USB；燒錄時開關要打開。</text></svg>